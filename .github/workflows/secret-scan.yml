name: Secret scan

# Called by test.yml (every CI run) and publish.yml (before anything is built
# for release), and every other job there `needs:` it -- so a leaked secret
# stops CI and blocks a release. It can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history: the action diffs base..head, and with no previous
      # commit (first push, release, manual run) it scans everything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # Pin the scanner image too; the action defaults to `latest`.
          version: 3.97.8
          # Also fail on findings that can't be verified against the live
          # service -- e.g. a device password has nothing to verify against.
          extra_args: --results=verified,unknown
